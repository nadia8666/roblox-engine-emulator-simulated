<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ree profile</title>
<style>
:root {
	color-scheme: light;
	--page: #f9f9f7;
	--surface: #fcfcfb;
	--ink: #0b0b0b;
	--ink-2: #52514e;
	--muted: #898781;
	--grid: #e1e0d9;
	--axis: #c3c2b7;
	--ring: rgba(11, 11, 11, 0.10);
	--wash: rgba(42, 120, 214, 0.10);
	--s1: #2a78d6;
	--s2: #eb6834;
	--s3: #1baf7a;
	--gray: #c3c2b7;
	--seq-1: #cde2fb;
	--seq-2: #86b6ef;
	--seq-3: #3987e5;
	--seq-4: #1c5cab;
	--good: #0ca30c;
	--warn: #fab219;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		color-scheme: dark;
		--page: #0d0d0d;
		--surface: #1a1a19;
		--ink: #f0efec;
		--ink-2: #c3c2b7;
		--muted: #898781;
		--grid: #2c2c2a;
		--axis: #383835;
		--ring: rgba(255, 255, 255, 0.10);
		--wash: rgba(57, 135, 229, 0.16);
		--s1: #3987e5;
		--s2: #d95926;
		--s3: #199e70;
		--gray: #52514e;
		--seq-1: #104281;
		--seq-2: #1c5cab;
		--seq-3: #3987e5;
		--seq-4: #86b6ef;
	}
}
:root[data-theme="dark"] {
	color-scheme: dark;
	--page: #0d0d0d;
	--surface: #1a1a19;
	--ink: #f0efec;
	--ink-2: #c3c2b7;
	--muted: #898781;
	--grid: #2c2c2a;
	--axis: #383835;
	--ring: rgba(255, 255, 255, 0.10);
	--wash: rgba(57, 135, 229, 0.16);
	--s1: #3987e5;
	--s2: #d95926;
	--s3: #199e70;
	--gray: #52514e;
	--seq-1: #104281;
	--seq-2: #1c5cab;
	--seq-3: #3987e5;
	--seq-4: #86b6ef;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
h2 { font-size: 16px; margin: 28px 0 10px; font-weight: 600; }
h3 { font-size: 14px; margin: 18px 0 8px; font-weight: 600; color: var(--ink-2); }
p.lead { margin: 0 0 14px; color: var(--ink-2); }
.warn { border-left: 3px solid var(--warn); padding: 6px 10px; margin: 8px 0; background: var(--surface); color: var(--ink-2); }
nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 6px; position: sticky; top: 0; background: var(--page); padding: 8px 0; z-index: 5; }
nav button { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--ring); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
nav button[aria-selected="true"] { border-color: var(--s1); box-shadow: inset 0 -2px 0 var(--s1); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 10px 12px; }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
.tile .sub { color: var(--muted); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 12px; margin: 10px 0; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 4px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th { color: var(--ink-2); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
th.text, td.text { text-align: left; }
td.text { max-width: 520px; overflow: hidden; text-overflow: ellipsis; }
td.num { font-variant-numeric: tabular-nums; }
tr.pick { cursor: pointer; }
tr.pick:hover td { background: var(--wash); }
tr.sel td { background: var(--wash); }
.bar { display: inline-block; height: 8px; border-radius: 0 4px 4px 0; background: var(--s1); vertical-align: middle; }
.muted { color: var(--muted); }
.code { font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
.code td { border: none; padding: 0 8px; }
.code td.src { text-align: left; white-space: pre; color: var(--ink); }
.code tr.hot td.src { background: var(--wash); }
pre.summary { font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre; overflow-x: auto; margin: 0; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; margin: 4px 0 8px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--key); }
.flame { position: relative; width: 100%; }
.flame div.f { position: absolute; height: 17px; border-radius: 2px; font-size: 11px; line-height: 17px; padding: 0 4px; overflow: hidden; white-space: nowrap; color: #fff; cursor: pointer; }
.flame div.f:hover { filter: brightness(1.12); }
.tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--ring); border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 20; display: none; max-width: 520px; }
.tip strong { font-size: 13px; }
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
.chart svg { width: 100%; height: 150px; display: block; }
.chart .title { font-size: 12px; color: var(--ink-2); margin-bottom: 2px; }
section[hidden] { display: none; }
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 6px 0; color: var(--ink-2); font-size: 13px; }
.controls select, .controls input { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--ring); border-radius: 6px; padding: 3px 6px; }
</style>
</head>
<body>
<main>
<h1>ree profile</h1>
<p class="lead" id="lead"></p>
<div id="warnings"></div>
<div class="tiles" id="tiles"></div>
<nav id="nav"></nav>
<section id="tab-hot" data-tab="Hot paths"></section>
<section id="tab-flame" data-tab="Flame graph" hidden></section>
<section id="tab-memory" data-tab="Memory" hidden></section>
<section id="tab-timeline" data-tab="Timeline" hidden></section>
<section id="tab-caches" data-tab="Caches" hidden></section>
<section id="tab-cpu" data-tab="CPU" hidden></section>
<section id="tab-text" data-tab="Summary text" hidden></section>
</main>
<div class="tip" id="tip"></div>
<script>
const PROFILE = /*PROFILE_DATA*/null;
// the profile.json version this page reads (report.rs PROFILE_VERSION)
const READS_VERSION = 2;
(function () {
	"use strict";
	const P = PROFILE || {};
	const $ = (id) => document.getElementById(id);
	const el = (tag, attrs, ...children) => {
		const node = document.createElement(tag);
		for (const [key, value] of Object.entries(attrs || {})) {
			if (key === "class") node.className = value;
			else if (key === "style") node.style.cssText = value;
			else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
			else node.setAttribute(key, value);
		}
		for (const child of children) node.append(child instanceof Node ? child : document.createTextNode(child == null ? "" : String(child)));
		return node;
	};
	const fmt = (value, digits) => value == null || Number.isNaN(value) ? "-" : Number(value).toLocaleString("en-US", { minimumFractionDigits: digits || 0, maximumFractionDigits: digits || 0 });
	const bytes = (value) => {
		value = Math.max(0, value || 0);
		if (value >= 1048576) return (value / 1048576).toFixed(2) + " MB";
		if (value >= 1024) return (value / 1024).toFixed(1) + " KB";
		return Math.round(value) + " B";
	};
	const compact = (value) => {
		const a = Math.abs(value);
		if (a >= 1e9) return (value / 1e9).toFixed(1) + "G";
		if (a >= 1e6) return (value / 1e6).toFixed(1) + "M";
		if (a >= 1e4) return (value / 1e3).toFixed(0) + "K";
		return fmt(value, a < 10 && a % 1 ? 2 : 0);
	};
	const pct = (part, whole) => whole > 0 ? (part / whole * 100).toFixed(1) + " %" : "-";
	const tip = $("tip");
	const showTip = (event, build) => {
		tip.replaceChildren(...build());
		tip.style.display = "block";
		const x = Math.min(event.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
		const y = Math.min(event.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
		tip.style.left = x + "px";
		tip.style.top = y + "px";
	};
	const hideTip = () => { tip.style.display = "none"; };

	const functions = P.functions || [];
	const byId = new Map(functions.map((f) => [f.id, f]));
	const shortModule = (module) => module ? module.split(/[.\/\\]/).pop() : "";
	const fname = (f) => f ? (f.module ? `${f.name || "anonymous"}  ${shortModule(f.module)}:${f.line}` : f.name) : "?";
	// a stack's script lines, innermost first (the engine's own Luau and C frames left out)
	const stackText = (frames) => (frames || []).filter((fr) => fr[0] >= 0 && byId.has(fr[0]) && byId.get(fr[0]).kind !== "engine Luau").slice(0, 4).map((fr) => `${shortModule(byId.get(fr[0]).module)}:${fr[1] >= 0 ? fr[1] : "native"}`).join(" < ") || "(engine)";
	const run = P.run || {};

	$("lead").textContent = `${run.command || "run"} ${run.status || ""}: ${fmt(run.frames)} frames, ${fmt(run.seconds, 2)} s emulated${run.fps ? " at " + run.fps + " fps" : ""}; kinds ${(P.kinds || []).join(", ")}; ${fmt(run.elapsed, 2)} s wall${run.harness ? "; " + run.harness : ""}`;
	for (const warning of P.warnings || []) $("warnings").append(el("div", { class: "warn" }, warning));

	// stat tiles
	const tiles = [];
	if (P.work) tiles.push(["Work clock", fmt(P.work.total_ms, 2) + " ms", `${fmt(P.work.per_frame_ms, 3)} ms a frame`]);
	if (P.work) tiles.push(["Script instructions", compact(P.work.script_insns), `${compact(P.work.engine_insns)} by the engine's Luau`]);
	if (P.alloc) tiles.push(["Allocated", bytes(P.alloc.bytes), `${compact(P.alloc.objects)} objects`]);
	// a snapshot's reachable heap and its garbage not swept yet (a profile from before they were counted apart has only
	// the heap walk's unreachable objects: the reachable heap is estimated as the rest)
	const reachableOf = (s) => s.reachable || { count: (s.objects || 0) - ((s.unreachable || {}).count || 0), bytes: (s.object_bytes || 0) - ((s.unreachable || {}).bytes || 0) };
	const unsweptOf = (s) => s.unswept || { count: (s.unreachable || {}).count || 0, bytes: (s.unreachable || {}).bytes || 0, by_type: [] };
	const snapshots = (P.heap && P.heap.snapshots) || [];
	if (snapshots.length) {
		const last = snapshots[snapshots.length - 1];
		tiles.push(["Reachable heap at " + last.label, bytes(reachableOf(last).bytes), `${compact(reachableOf(last).count)} objects; ${bytes(unsweptOf(last).bytes)} garbage not swept yet`]);
	}
	if (P.heap && P.heap.gc) tiles.push(["Collector", fmt(P.heap.gc.cycles) + " cycles", `${bytes(P.heap.gc.freed)} freed, ${fmt(P.heap.gc.ms, 1)} ms`]);
	if (P.time) tiles.push(["Host time sampled", fmt(P.time.sampled_ms, 1) + " ms", "1 ms ticks at safepoints"]);
	if (P.counters && P.counters.run && !P.counters.error) {
		const names = P.counters.names || [];
		const rates = P.counters.run.rates || {};
		const lead = names.includes("cycles") ? "cycles" : names[0];
		if (rates["load stall share"] != null) tiles.push(["Stalled on loads", (rates["load stall share"] * 100).toFixed(1) + " %", `of the run thread's cycles${rates["L1D miss latency"] != null ? `; a miss ${fmt(rates["L1D miss latency"], 0)} cycles` : ""}`]);
		if (rates.IPC != null) tiles.push(["IPC", fmt(rates.IPC, 2), "instructions a cycle, run thread"]);
		if (lead) tiles.push([lead[0].toUpperCase() + lead.slice(1), compact(P.counters.run.counts[lead] || 0), P.counters.source === "mock" ? "made-up counts (mock)" : "the run thread, counted by the CPU"]);
	}
	tiles.push(["Frames", fmt(run.frames), `${fmt(run.seconds, 2)} s emulated`]);
	for (const [label, value, sub] of tiles) $("tiles").append(el("div", { class: "tile" }, el("div", { class: "label" }, label), el("div", { class: "value" }, value), el("div", { class: "sub" }, sub)));

	// tabs
	// (a tab's name is its section's id without "tab-": a link names it, report.html#memory, and an id of the same name
	// would scroll the page past its header)
	const sections = [...document.querySelectorAll("section[data-tab]")];
	const tabName = (section) => section.id.slice(4);
	const select = (name) => {
		for (const section of sections) section.hidden = tabName(section) !== name;
		for (const button of $("nav").children) button.setAttribute("aria-selected", String(button.dataset.id === name));
		try { localStorage.setItem("ree-profile-tab", name); } catch (_) {}
	};
	for (const section of sections) {
		const button = el("button", { "data-id": tabName(section), onclick: () => select(tabName(section)) }, section.dataset.tab);
		button.dataset.id = tabName(section);
		$("nav").append(button);
	}

	// a sortable table: columns [{key, label, text?, fmt?, bar?}]
	const table = (rows, columns, options) => {
		options = options || {};
		let sortKey = options.sort || (columns[1] || columns[0]).key;
		let descending = true;
		const wrap = el("div", { class: "card" });
		const render = () => {
			const sorted = rows.slice().sort((a, b) => {
				const x = columns.find((c) => c.key === sortKey).value(a), y = columns.find((c) => c.key === sortKey).value(b);
				return (typeof x === "string" ? x.localeCompare(y) : x - y) * (descending ? -1 : 1);
			}).slice(0, options.limit || 200);
			const max = Math.max(1e-12, ...sorted.map((row) => columns.find((c) => c.bar) ? columns.find((c) => c.bar).value(row) : 0));
			const head = el("tr", {}, ...columns.map((c) => el("th", { class: c.text ? "text" : "", onclick: () => { descending = sortKey === c.key ? !descending : true; sortKey = c.key; render(); } }, c.label + (sortKey === c.key ? (descending ? " ↓" : " ↑") : ""))));
			const body = sorted.map((row) => {
				const tr = el("tr", { class: options.onpick ? "pick" : "" }, ...columns.map((c) => {
					const value = c.value(row);
					const cell = el("td", { class: c.text ? "text" : "num", title: c.text ? String(value) : "" });
					if (c.bar) cell.append(el("span", { class: "bar", style: `width:${Math.max(1, value / max * 70)}px;margin-right:6px` }));
					cell.append(c.fmt ? c.fmt(value, row) : String(value));
					return cell;
				}));
				if (options.onpick) tr.addEventListener("click", () => { for (const other of tr.parentNode.children) other.classList.remove("sel"); tr.classList.add("sel"); options.onpick(row); });
				return tr;
			});
			wrap.replaceChildren(el("table", {}, el("thead", {}, head), el("tbody", {}, ...body)));
		};
		render();
		return wrap;
	};

	// Hot paths: functions, then the selected one's callers, callees and lines
	(function hot() {
		const section = $("tab-hot");
		const hasWork = !!P.work, hasTime = !!P.time, hasAlloc = !!P.alloc;
		section.append(el("h2", {}, "Functions"));
		section.append(el("p", { class: "lead" }, hasWork ? "Work is the work clock: what Studio would take for the same code, booked to the instruction that caused it; the same every run. Self is the function's own instructions; total includes what it called. Click a function for its callers, callees and annotated source." : "Click a function for its callers, callees and annotated source."));
		const columns = [{ key: "name", label: "function", text: true, value: (f) => fname(f) }];
		if (hasWork) columns.push(
			{ key: "self_work", label: "self work ms", value: (f) => f.self.work_ms, fmt: (v) => fmt(v, 3), bar: true },
			{ key: "total_work", label: "total work ms", value: (f) => f.total.work_ms, fmt: (v) => fmt(v, 3) },
			{ key: "calls", label: "calls", value: (f) => f.calls, fmt: (v) => fmt(v) },
			{ key: "insns", label: "self insns", value: (f) => f.self.insns, fmt: (v) => compact(v) });
		// (a function -O2 inlined into its callers: the calls its copies there stood for)
		if (hasWork && functions.some((f) => f.inlined)) columns.splice(4, 0, { key: "inlined", label: "inlined calls", value: (f) => f.inlined ? f.inlined.calls : 0, fmt: (v) => v ? fmt(v) : "" });
		if (hasTime) columns.push({ key: "self_time", label: "self host ms", value: (f) => f.self.time_ms, fmt: (v) => fmt(v, 1), bar: !hasWork }, { key: "total_time", label: "total host ms", value: (f) => f.total.time_ms, fmt: (v) => fmt(v, 1) });
		if (hasAlloc) columns.push({ key: "self_alloc", label: "allocated", value: (f) => f.self.alloc_bytes, fmt: (v) => bytes(v), bar: !hasWork && !hasTime }, { key: "total_alloc", label: "total allocated", value: (f) => f.total.alloc_bytes, fmt: (v) => bytes(v) });
		const detail = el("div");
		const rows = functions.filter((f) => f.kind !== "engine Luau" && (f.self.work_ms > 0 || f.total.work_ms > 0 || f.self.time_ms > 0 || f.total.time_ms > 0 || f.self.alloc_bytes > 0 || f.calls > 0 || f.inlined));
		// (a profile with no work, time or allocations has the name column alone)
		section.append(table(rows, columns, { sort: (columns[1] || columns[0]).key, limit: 300, onpick: (f) => showFunction(f, detail) }));
		section.append(detail);
		if (P.work && P.work.native_functions && P.work.native_functions.length) {
			section.append(el("div", { class: "warn" }, `${P.work.native_functions.length} natively compiled functions seen: their instructions are not counted (their entries from interpreted code and the work booked while they ran are), and a call from native code into native code is not seen.`));
		}
		section.append(el("h2", {}, "Lines"));
		const lines = (P.lines || []).filter((l) => byId.has(l.function) && byId.get(l.function).kind !== "engine Luau");
		const lineColumns = [
			{ key: "line", label: "line", text: true, value: (l) => `${shortModule(byId.get(l.function).module)}:${l.line >= 0 ? l.line : "native"}` },
			{ key: "function", label: "function", text: true, value: (l) => (byId.get(l.function).name || "anonymous") + (l.inlined != null && byId.has(l.inlined) ? ` (inlined ${byId.get(l.inlined).name || "anonymous"})` : "") }];
		if (hasWork) lineColumns.push(
			{ key: "work", label: "self work ms", value: (l) => l.work_ms, fmt: (v) => fmt(v, 3), bar: true },
			{ key: "total", label: "total work ms", value: (l) => l.total_work_ms, fmt: (v) => fmt(v, 3) },
			{ key: "insns", label: "insns", value: (l) => l.insns, fmt: (v) => compact(v) },
			{ key: "ops", label: "opcodes", text: true, value: (l) => Object.entries(l.ops || {}).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([op, n]) => `${op} ${compact(n)}`).join(", ") });
		if (hasTime) lineColumns.push({ key: "time", label: "self host ms", value: (l) => l.time_ms, fmt: (v) => fmt(v, 1), bar: !hasWork });
		if (hasAlloc) lineColumns.push({ key: "alloc", label: "allocated", value: (l) => l.alloc_bytes, fmt: (v) => bytes(v) });
		section.append(table(lines, lineColumns, { sort: lineColumns[2] ? lineColumns[2].key : "line", limit: 200, onpick: (l) => showFunction(byId.get(l.function), detail, l.line) }));
		if (P.work && P.work.opcodes) {
			section.append(el("h2", {}, "Opcodes"));
			section.append(table(P.work.opcodes, [
				{ key: "op", label: "opcode", text: true, value: (o) => o.op },
				{ key: "count", label: "executed", value: (o) => o.count, fmt: (v) => fmt(v), bar: true },
				{ key: "work", label: "work ms", value: (o) => o.work_ms, fmt: (v) => fmt(v, 3) },
				{ key: "share", label: "share", value: (o) => o.count, fmt: (v) => pct(v, P.work.script_insns) }], { sort: "count", limit: 100 }));
		}
		const first = rows.slice().sort((a, b) => (b.self.work_ms - a.self.work_ms) || (b.self.time_ms - a.self.time_ms) || (b.self.alloc_bytes - a.self.alloc_bytes))[0];
		if (first) showFunction(first, detail);
	})();

	function showFunction(f, target, focusLine) {
		if (!f) return;
		const edges = P.edges || [];
		const callers = edges.filter((e) => e.callee === f.id).map((e) => ({ ...e, other: e.caller }));
		const callees = edges.filter((e) => e.caller === f.id).map((e) => ({ ...e, other: e.callee }));
		const otherColumns = [
			{ key: "name", label: "function", text: true, value: (e) => (fname(byId.get(e.other)) || "?") + (e.inlined ? " (inlined)" : "") },
			{ key: "calls", label: "calls", value: (e) => e.calls, fmt: (v) => fmt(v) },
			{ key: "work", label: "work ms", value: (e) => e.work_ms, fmt: (v) => fmt(v, 3), bar: true },
			{ key: "insns", label: "insns", value: (e) => e.insns, fmt: (v) => compact(v) }];
		const nodes = [el("h2", {}, fname(f)),
			el("p", { class: "lead" }, `${f.module || ""}${f.native ? " · natively compiled: " + fmt(f.native_entries) + " native entries, instructions not counted" : ""} · ${fmt(f.calls)} calls · self ${fmt(f.self.work_ms, 3)} ms / total ${fmt(f.total.work_ms, 3)} ms of work`)];

	// Flame graph (icicle) of the call tree's work or instructions
	(function flame() {
		const section = $("tab-flame");
		const tree = P.tree || [];
		if (!tree.length) { section.append(el("p", { class: "muted" }, "No call tree: run with --profile work.")); return; }
		section.append(el("h2", {}, "Call tree"));
		section.append(el("p", { class: "lead" }, "Each box is a function reached by one path of calls; its width is what it and its callees took. Click a box to zoom in, the top row to zoom out."));
		const control = el("select", {}, el("option", { value: "work" }, "work clock"), el("option", { value: "insns" }, "instructions"));
		section.append(el("div", { class: "controls" }, el("label", {}, "Width: ", control)));
		section.append(el("div", { class: "legend" }, el("span", { style: "--key: var(--s1)" }, "script Luau"), el("span", { style: "--key: var(--s3)" }, "engine Luau"), el("span", { style: "--key: var(--gray)" }, "C function or phase"), el("span", { style: "--key: var(--s2)" }, "natively compiled")));
		const box = el("div", { class: "flame card" });
		section.append(box);
		// tree rows: [parent, function, calls, work_us, insns, label]
		const children = tree.map(() => []);
		tree.forEach((node, index) => { if (node[0] >= 0) children[node[0]].push(index); });
		let measure = "work";
		const totals = new Float64Array(tree.length);
		const compute = () => {
			for (let index = tree.length - 1; index >= 0; index--) {
				totals[index] = (measure === "work" ? tree[index][3] : tree[index][4]) + children[index].reduce((sum, child) => sum + totals[child], 0);
			}
		};
		let rootIndex = 0;
		const draw = () => {
			compute();
			box.replaceChildren();
			const width = box.clientWidth - 24 || 900;
			const rows = [];
			const place = (index, x, depth, scale) => {
				if (totals[index] * scale < 1.5 || depth > 60) return;
				rows.push([index, x, depth, totals[index] * scale]);
				let offset = x;
				const ordered = children[index].slice().sort((a, b) => totals[b] - totals[a]);
				for (const child of ordered) { place(child, offset, depth + 1, scale); offset += totals[child] * scale; }
			};
			if (totals[rootIndex] <= 0) { box.append(el("p", { class: "muted" }, "Nothing was booked.")); return; }
			place(rootIndex, 0, 0, width / totals[rootIndex]);
			const depth = Math.max(...rows.map((row) => row[2])) + 1;
			box.style.height = (depth * 19 + 24) + "px";
			for (const [index, x, level, w] of rows) {
				const node = tree[index];
				const f = byId.get(node[1]);
				const color = node[1] < 0 ? "var(--gray)" : f && f.kind === "engine Luau" ? "var(--s3)" : f && f.native ? "var(--s2)" : "var(--s1)";
				const label = node[5] || fname(f);
				const div = el("div", { class: "f", style: `left:${x + 12}px;top:${level * 19 + 12}px;width:${Math.max(1, w - 2)}px;background:${color};${node[1] < 0 ? "color:var(--ink)" : ""}` }, w > 40 ? label : "");
				div.addEventListener("mousemove", (event) => showTip(event, () => [el("strong", {}, measure === "work" ? fmt(totals[index] / 1000, 3) + " ms" : compact(totals[index]) + " instructions"), el("div", {}, label), el("div", { class: "muted" }, `${pct(totals[index], totals[0])} of all · ${fmt(node[2])} calls · self ${measure === "work" ? fmt(node[3] / 1000, 3) + " ms" : compact(node[4])}`)]));
				div.addEventListener("mouseleave", hideTip);
				div.addEventListener("click", () => { rootIndex = index === rootIndex ? (tree[index][0] >= 0 ? tree[index][0] : 0) : index; draw(); });
				box.append(div);
			}
		};
		control.addEventListener("change", () => { measure = control.value; draw(); });
		new ResizeObserver(() => { if (!section.hidden) draw(); }).observe(box);
		draw();
	})();

	// Timeline: one small chart per measure, a shared crosshair

		const value = (name, scale) => (r) => { const v = col(name) < 0 ? null : r[col(name)]; return v == null ? null : v / (scale || 1); };

			["Host time (ms a frame)", value("host_ms"), (v) => fmt(v, 2) + " ms"],

			["Instructions a frame", value("instructions"), (v) => compact(v)],
			["Collector (ms a frame)", value("gc_ms"), (v) => fmt(v, 3) + " ms"],
			["Instances in the DataModel", value("instances_in_datamodel"), (v) => fmt(v)],

				chart.cross.setAttribute("x1", chart.x(index)); chart.cross.setAttribute("x2", chart.x(index)); chart.cross.setAttribute("visibility", "visible");

				{ key: "outcomes", label: "outcomes but hits", text: true, value: told },
				{ key: "runs", label: "runs", value: (s) => Object.values(s.outcomes || {}).reduce((a, n) => a + n, 0), fmt: (v) => fmt(v) },
				{ key: "charged", label: "charged us a frame", value: (s) => s.charged_work_us_per_frame || 0, fmt: (v) => fmt(v, 3) },
				{ key: "extra", label: "extra us a frame", value: (s) => s.extra_work_us_per_frame || 0, fmt: (v) => fmt(v, 3), bar: true },
				{ key: "noise", label: "within the noise", value: (s) => s.within_noise || 0, fmt: (v) => v ? fmt(v) : "" }], { sort: "extra", limit: 200 }));
			const toolKinds = ((C.tool || {}).by_kind || []);
			if (toolKinds.length) section.append(el("p", { class: "muted" }, `ree's own code (a harness one of ree's tools ran, rur.record): ${fmt(toolKinds.reduce((a, k) => a + k.lookups, 0))} lookups, left out of the tables above.`));
			const prices = C.prices;
			if (prices) {
				const rows = [];
				for (const [kind, k] of Object.entries(prices.kinds || {})) {
					for (const [name, x] of Object.entries(k.outcomes || {})) if (x.ns != null || x.charged) rows.push({ kind, name: name.replace(/_/g, " "), x });
					for (const [depth, x] of Object.entries(k.metatable_depths || {})) if (x.ns != null) rows.push({ kind, name: `metatable walk, ${depth}`, x });
				}
				const provenance = Object.entries(prices.provenance || {}).map(([key, v]) => `${key}: ${v}`).join("; ");
				section.append(el("details", {}, el("summary", {}, "The prices"), el("p", { class: "muted" }, `${prices.about || ""}. ${provenance}`), table(rows, [
					{ key: "kind", label: "cache", text: true, value: (r) => r.kind },
					{ key: "name", label: "outcome", text: true, value: (r) => r.name },
					{ key: "ns", label: "work clock ns", value: (r) => r.x.ns, fmt: (v) => v == null ? "-" : fmt(v, 2) },
					{ key: "spread", label: "spread", text: true, value: (r) => r.x.charged ? "charged by the work clock at the site" : `${fmt(r.x.low_ns, 2)} to ${fmt(r.x.high_ns, 2)}${r.x.within_noise ? " (within the noise)" : ""}` },
					{ key: "source", label: "from", text: true, value: (r) => r.x.source }], { sort: "ns" })));
			}
		}
		if ((P.builtins || []).length) {
			section.append(el("h2", {}, "Builtin calls"));
			section.append(el("p", { class: "lead" }, "The compiler's fast calls: served by the builtin's fast path, or declined (the call went the full way) and why. A decline's charge is the work clock's own (its fast call, its fallback's instructions and the C function it reached), part of its function's work; the fast path would charge the same calls its fast call and the builtin's own counted work, so a fix saves the difference."));
			const why = (b) => Object.entries(b.declines || {}).filter(([, n]) => n > 0).map(([name, n]) => `${name.replace(/_/g, " ")} ${fmt(n)}`).join(", ");
			section.append(table(P.builtins, [
				{ key: "name", label: "builtin", text: true, value: (b) => b.name },
				{ key: "calls", label: "calls", value: (b) => b.calls, fmt: (v) => fmt(v) },
				{ key: "fast", label: "fast path", value: (b) => b.calls ? b.fast / b.calls : 0, fmt: pct },
				{ key: "why", label: "declined, why", text: true, value: why },
				{ key: "price", label: "clock ns a decline", text: true, value: (b) => b.decline_charged_ns == null ? "" : fmt(b.decline_charged_ns, 1) },
				{ key: "fastpath", label: "fast path ns", text: true, value: (b) => b.fast_equivalent_ns == null ? "" : fmt(b.fast_equivalent_ns, 1) },
				{ key: "charged", label: "charged us a frame", value: (b) => b.decline_charged_us_per_frame || 0, fmt: (v) => fmt(v, 3), bar: true }], { sort: "charged" }));
		}
		if (emulator) {
			section.append(el("h2", {}, "ree's caches"));
			section.append(el("p", { class: "muted" }, "How fast ree runs, not what the game costs."));
			section.append(table(emulator.filter((c) => c.hits + c.misses + c.evictions > 0), [
				{ key: "name", label: "cache", text: true, value: (c) => c.name },
				{ key: "rate", label: "hit rate", value: (c) => c.hits / Math.max(1, c.hits + c.misses), fmt: pct, bar: true },
				{ key: "hits", label: "hits", value: (c) => c.hits, fmt: (v) => fmt(v) },
				{ key: "misses", label: "misses", value: (c) => c.misses, fmt: (v) => fmt(v) },
				{ key: "evictions", label: "evicted", value: (c) => c.evictions, fmt: (v) => fmt(v) },
				{ key: "about", label: "what it keeps", text: true, value: (c) => c.about }], { sort: "hits" }));
		}
	})();

	// a line chart of one value a row, with a tip at the pointer (the CPU tab's frames)
	const svgNode = (tag, attrs) => { const node = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v); return node; };
	const lineChart = (title, values, show, labels) => {
		const svg = svgNode("svg", { viewBox: "0 0 400 150", preserveAspectRatio: "none" });
		const max = Math.max(1e-9, ...values), min = Math.min(0, ...values);
		const x = (i) => 36 + (i / Math.max(1, values.length - 1)) * 356, y = (v) => 128 - (v - min) / (max - min) * 112;
		for (const tick of [min, (min + max) / 2, max]) {
			svg.append(svgNode("line", { x1: 36, x2: 392, y1: y(tick), y2: y(tick), stroke: "var(--grid)", "stroke-width": 1, "vector-effect": "non-scaling-stroke" }));
			const label = svgNode("text", { x: 32, y: y(tick) + 4, "text-anchor": "end", "font-size": 10, fill: "var(--muted)" });
			label.textContent = compact(tick);
			svg.append(label);
		}
		svg.append(svgNode("path", { d: values.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(""), fill: "none", stroke: "var(--s1)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke" }));
		svg.addEventListener("mousemove", (event) => {
			const box = svg.getBoundingClientRect();
			const index = Math.max(0, Math.min(values.length - 1, Math.round(((event.clientX - box.left) / box.width * 400 - 36) / 356 * (values.length - 1))));
			showTip(event, () => [el("strong", {}, labels[index]), el("div", {}, `${show(values[index])}  `, el("span", { class: "muted" }, title))]);
		});
		svg.addEventListener("mouseleave", hideTip);
		return el("div", { class: "card chart" }, el("div", { class: "title" }, title), svg);
	};

	// the hardware counters (`--profile hw`): the run's totals and what memory cost it, by phase and thread, functions,
	// call sites, frames
	const counterSection = (section, k) => {
		section.append(el("h2", {}, "Hardware counters"));
		if (k.error) { section.append(el("div", { class: "warn" }, "Hardware counters not read: " + k.error)); return; }
		const names = k.names || [];
		const lead = names.includes("load-stall-cycles") ? "load-stall-cycles" : names.includes("cycles") ? "cycles" : names[0];
		const byCalls = k.attribution && k.attribution.method === "calls";
		const how = byCalls
			? `Readings around sampled Luau calls give each function its own counts: everything counted while one of its calls was the innermost read around, its callees' apart; a Luau thread holding a sampled call is read where it resumes and stops, so each thread's work is its own calls'. Each call is drawn on its own: every call of a function whose calls take ${fmt(k.attribution.threshold_us, 0)} us or more was read around, one in several of shorter ones (standing for the rest: an unbiased estimate, which can fall below zero for a function), a recursion's inner calls with its sampled outer one, none of functions whose calls take under ${fmt(k.attribution.min_sampled_us, 0)} us once their first calls measured them (their counts are their callers'). A reading costs the code after it some of its caches, so a short sampled function reads a little high and its callers low. A line's figures are what the calls made from it cost. A reading's own counts are taken out of every stretch between readings.`
			: "A function's self counts are what was counted since the sample before one that found it innermost; its total, since the samples that found it anywhere on the stack.";
		section.append(el("p", { class: "lead" }, "What the CPU counted while the run thread ran: these measure ree's own process running the Luau, a guide to where memory costs, not a client's frame time (the work clock estimates that). " + how + (k.source === "mock" ? " These counts are made up (REE_HW_COUNTERS=mock): the thread's cycle count and fixed shares of it." : "")));
		for (const note of k.notes || []) section.append(el("p", { class: "muted" }, note));
		const runCounts = (k.run && k.run.counts) || {};
		const totals = names.map((name, i) => el("tr", {}, el("td", { class: "text" }, name), el("td", { class: "num" }, fmt(runCounts[name])), el("td", { class: "text muted" }, [(k.about || [])[i] || (k.sources || [])[i] || "", (k.amd || [])[i] ? ` (AMD: ${(k.amd || [])[i]})` : ""].join(""))));
		const shownRate = (label, value) => /share|rate|per load/.test(label) ? (value * 100).toFixed(1) + " %" : label.includes("latency") ? fmt(value, 0) + " cycles" : fmt(value, 2);
		for (const [label, value] of Object.entries((k.run && k.run.rates) || {})) totals.push(el("tr", {}, el("td", { class: "text" }, label), el("td", { class: "num" }, shownRate(label, value)), el("td", { class: "text muted" }, "")));
		section.append(el("div", { class: "card" }, el("table", {}, el("tbody", {}, ...totals))));
		const readings = k.readings || {};
		section.append(el("p", { class: "muted" }, `${fmt(readings.count)} readings${byCalls ? ` (${fmt(2 * (readings.calls || 0))} of them around ${fmt(readings.calls || 0)} sampled calls${k.attribution.switch_readings ? `, ${fmt(k.attribution.switch_readings)} where threads switched` : ""})` : ` (${fmt(readings.samples)} samples at safepoints)`} over ${fmt((k.run || {}).seconds, 2)} s; ${fmt(readings.matched)} found their own switch.` + (readings.own_counts ? ` A reading's own counts${readings.taken_out ? ", taken out of every stretch" : ", counted with the run's"}: ${names.map((n) => `${n} ${compact(readings.own_counts[n] || 0)}`).join(", ")}.` : "") + (byCalls && k.attribution.readings_share_of_cycles != null ? ` The readings took ${(k.attribution.readings_share_of_cycles * 100).toFixed(1)} % of the run thread's cycles.` : "")));
		const trace = k.trace || {};
		if (trace.lost_events || trace.lost_buffers) section.append(el("div", { class: "warn" }, `The trace session lost ${fmt(trace.lost_events)} events and ${fmt(trace.lost_buffers)} buffers: some of the threads' stretches are missing.`));
		if (trace.without_counters) section.append(el("p", { class: "muted" }, `${fmt(trace.without_counters)} context switches came without counter values.`));
		const ratio = (counts, part, whole) => counts && counts[part] != null && counts[whole] ? counts[part] / counts[whole] : null;
		const stallShare = (counts) => ratio(counts, "load-stall-cycles", "cycles");
		const ipcOf = (counts) => ratio(counts, "instructions", "cycles") || 0;
		const hasStalls = names.includes("load-stall-cycles") && names.includes("cycles");
		const percentCell = (v) => v == null ? "-" : (v * 100).toFixed(1) + " %";
		const counterColumns = (get, prefix) => names.map((name) => ({ key: name, label: prefix + name, value: (row) => (get(row) || {})[name] || 0, fmt: (v) => compact(v), bar: name === lead }));
		const costColumns = (get, prefix) => (hasStalls ? [{ key: "stalled", label: prefix + "stalled on loads", value: (row) => stallShare(get(row)) || 0, fmt: percentCell }] : []).concat([{ key: "ipc", label: prefix + "IPC", value: (row) => ipcOf(get(row)), fmt: (v) => fmt(v, 2) }]);
		if ((k.phases || []).length) {
			section.append(el("h3", {}, "By phase"));
			section.append(table(k.phases, [{ key: "phase", label: "phase", text: true, value: (p) => p.phase }, ...counterColumns((p) => p.counts, ""), ...costColumns((p) => p.counts, "")], { sort: lead }));
		}
		if ((k.threads || []).length) {
			section.append(el("h3", {}, "By thread"));
			section.append(table(k.threads, [{ key: "thread", label: "thread", text: true, value: (t) => t.run_thread ? "the run thread" + (t.name ? ` (${t.name})` : "") : t.name || `thread ${t.id}` }, ...counterColumns((t) => t.counts, ""), { key: "slices", label: "slices", value: (t) => t.slices, fmt: (v) => fmt(v) }], { sort: lead }));
		}
		section.append(el("h3", {}, "Functions"));
		const label = (f) => f.module ? `${f.name || "anonymous"}  ${shortModule(f.module)}:${f.line}` : f.name;
		section.append(table(k.functions || [], [{ key: "name", label: "function", text: true, value: label }, ...counterColumns((f) => f.self, "self "), ...costColumns((f) => f.self, "self "), { key: "total", label: "total " + lead, value: (f) => (f.total || {})[lead] || 0, fmt: (v) => compact(v) }], { sort: lead, limit: 300 }));
		if ((k.lines || []).length) {
			const calls = (k.lines[0] || {}).calls;
			section.append(el("h3", {}, calls ? "Call sites (what the calls made from a line cost)" : "Lines"));
			const of = (l) => calls ? l.total : l.self;
			section.append(table(k.lines, [{ key: "line", label: "line", text: true, value: (l) => `${shortModule(l.module || "")}:${l.line}` }, { key: "fn", label: "function", text: true, value: (l) => l.name || "anonymous" }, ...counterColumns(of, calls ? "calls' " : "self "), ...costColumns(of, calls ? "calls' " : "self ")], { sort: lead, limit: 200 }));
		}
		const frames = k.frames;
		if (frames && frames.rows && frames.rows.length) {
			section.append(el("h3", {}, "Per frame"));
			const col = (name) => frames.columns.indexOf(name);
			const labels = frames.rows.map((r) => `frame ${r[col("frame")]} · ${(P.phases || [])[r[col("phase")]] || ""}`);
			const series = [[lead + " a frame", frames.rows.map((r) => r[col(lead)]), (v) => compact(v)]];
			if (col("load stall share") >= 0) series.push(["share of cycles stalled on loads", frames.rows.map((r) => r[col("load stall share")]), (v) => (v * 100).toFixed(1) + " %"]);
			else if (col("load-stall-cycles") >= 0 && col("cycles") >= 0) series.push(["share of cycles stalled on loads", frames.rows.map((r) => r[col("cycles")] ? r[col("load-stall-cycles")] / r[col("cycles")] : 0), (v) => (v * 100).toFixed(1) + " %"]);
			if (col("L1D miss latency") >= 0) series.push(["L1D miss latency (cycles)", frames.rows.map((r) => r[col("L1D miss latency")]), (v) => fmt(v, 0)]);
			if (col("instructions") >= 0 && col("cycles") >= 0) series.push(["IPC", frames.rows.map((r) => r[col("cycles")] ? r[col("instructions")] / r[col("cycles")] : 0), (v) => fmt(v, 2)]);
			for (const name of names.filter((n) => n.endsWith("-misses") || n.startsWith("demand-fills"))) series.push([name + " a frame", frames.rows.map((r) => r[col(name)]), (v) => compact(v)]);
			const grid = el("div", { class: "charts" });
			for (const [title, values, show] of series) grid.append(lineChart(title, values, show, labels));
			section.append(grid);
			const shownCell = (name) => name === "phase" ? (v) => (P.phases || [])[v] || String(v) : name === "host_ms" ? (v) => fmt(v, 3) : /share/.test(name) ? (v) => (v * 100).toFixed(1) + " %" : /latency|per 1000|IPC/.test(name) ? (v) => fmt(v, 2) : (v) => fmt(v);
			section.append(table(frames.rows.map((r) => ({ r })), frames.columns.map((name, i) => ({ key: name, label: name.replace(/_/g, " "), value: (x) => x.r[i], fmt: shownCell(name) })), { sort: lead, limit: 400 }));
		}
	};

	// CPU
	(function cpu() {
		const section = $("tab-cpu");
		const c = P.cpu;
		if (!c && !P.counters) { section.append(el("p", { class: "muted" }, "No CPU profile: run with --profile cpu, or --profile hw for the CPU's hardware counters.")); return; }
		if (c) {
			section.append(el("h2", {}, "CPU"));
			const growth = (x) => x ? `${bytes(x.baseline)} at the run's start, ${x.growth < 0 ? "-" : "+"}${bytes(Math.abs(x.growth))} by its end${x.run_peak != null ? ` (most ${bytes(x.run_peak)})` : ""}` : "-";
			const rows = [["Run thread cycles (reference cycles)", c.thread_cycles == null ? "-" : fmt(c.thread_cycles)], ["Run thread CPU time", c.thread_ms == null ? "-" : fmt(c.thread_ms, 1) + " ms"], ["Process CPU", c.process_cpu_s ? `${fmt(c.process_cpu_s.user, 2)} s user, ${fmt(c.process_cpu_s.kernel, 2)} s kernel` : "-"], ["Page faults", c.page_faults == null ? "-" : fmt(c.page_faults)], ["Working set", growth(c.working_set)], ["Private bytes", growth(c.private_bytes)]];
			if (c.pass) section.append(el("p", { class: "muted" }, "From " + c.pass));
			section.append(el("div", { class: "card" }, el("table", {}, el("tbody", {}, ...rows.map(([k, v]) => el("tr", {}, el("td", { class: "text" }, k), el("td", { class: "num" }, v)))))));
			if (c.pmc) section.append(table(c.pmc, [{ key: "counter", label: "counter", text: true, value: (x) => x.counter }, { key: "value", label: "value", value: (x) => x.value, fmt: (v) => fmt(v) }]));
			if (c.pmc_missing && !P.counters) section.append(el("div", { class: "warn" }, "Hardware counters not read: " + c.pmc_missing));
			if (c.pmc_sources && c.pmc_sources.length) section.append(el("p", { class: "muted" }, "Counters this CPU offers to ETW: " + c.pmc_sources.join(", ")));
		}
		if (P.counters) counterSection(section, P.counters);
	})();

	$("tab-text").append(el("div", { class: "card" }, el("pre", { class: "summary" }, P.summary || "")));
	if (P.version !== READS_VERSION) document.querySelector("main").prepend(el("div", { class: "warn" }, `This page reads profile version ${READS_VERSION}; this profile is version ${P.version == null ? "unknown" : P.version}: figures whose meaning changed between them may read wrong.`));
	// (a link may name the tab: report.html#memory)
	let start = location.hash.slice(1);
	if (!sections.some((s) => tabName(s) === start)) {
		try { start = localStorage.getItem("ree-profile-tab") || "hot"; } catch (_) { start = "hot"; }
	}
	select(sections.some((s) => tabName(s) === start) ? start : "hot");
})();
</script>
</body>
</html>
